<!doctype html>
<!--
  GitHub social preview cards, 1280x640. Open with ?v=a, ?v=b or ?v=c.
  Rendered to PNG by scripts/marketing/render-social-preview.mjs.
  Images are real captures from docs/marketing/screenshots/ and the home-grid
  thumbnails in public/assets/fractal-images/. Fonts are the site's own files.
  Key content stays inside a 64 px safe margin.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fractal Garden social preview</title>
    <style>
      @font-face {
        font-family: "Montserrat";
        font-weight: 500;
        src: url("../../../public/assets/fonts/montserrat-v31-500-latin.woff2") format("woff2");
      }
      @font-face {
        font-family: "Merriweather";
        font-weight: 300;
        src: url("../../../public/assets/fonts/merriweather-v33-300-latin.woff2") format("woff2");
      }
      :root {
        --dark: #091115;
        --ink: #f5f1d1;
        --gold: #f5cc75;
        --field: #15232b;
        --safe: 64px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1280px;
        height: 640px;
        overflow: hidden;
        background: var(--dark);
        color: var(--ink);
      }
      .card {
        position: relative;
        width: 1280px;
        height: 640px;
        overflow: hidden;
        display: none;
      }
      .card.active {
        display: block;
      }
      .title {
        font-family: "Montserrat", sans-serif;
        font-weight: 500;
        letter-spacing: 0.06em;
        line-height: 1;
      }
      .line {
        font-family: "Merriweather", serif;
        font-weight: 300;
        line-height: 1.35;
      }
      .url {
        font-family: "Montserrat", sans-serif;
        font-weight: 500;
        color: var(--gold);
        letter-spacing: 0.08em;
      }

      /* A: one full-bleed capture, text on a darkened left side. */
      #a .shot {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 60% 50%;
      }
      #a .shade {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          rgba(9, 17, 21, 0.94) 0%,
          rgba(9, 17, 21, 0.86) 34%,
          rgba(9, 17, 21, 0) 62%
        );
      }
      #a .text {
        position: absolute;
        left: var(--safe);
        bottom: var(--safe);
        width: 560px;
      }
      #a .title {
        font-size: 76px;
        padding-bottom: 18px;
        border-bottom: 2px solid var(--ink);
        display: inline-block;
      }
      #a .line {
        font-size: 34px;
        margin-top: 28px;
      }
      #a .url {
        font-size: 28px;
        margin-top: 30px;
      }

      /* B: the home page heading and a row of home-grid thumbnails. */
      #b {
        text-align: center;
      }
      #b .title {
        font-size: 96px;
        margin-top: 64px;
        padding-bottom: 20px;
        border-bottom: 2px solid var(--ink);
        display: inline-block;
      }
      #b .line {
        font-size: 32px;
        margin-top: 26px;
      }
      #b .tiles {
        position: absolute;
        left: var(--safe);
        right: var(--safe);
        bottom: 112px;
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 16px;
      }
      #b .tiles img {
        width: 100%;
        aspect-ratio: 1;
        object-fit: cover;
        border-radius: 6px;
        display: block;
      }
      #b .url {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 56px;
        font-size: 26px;
      }

      /* C: text column on the left, a 2x2 mosaic of captures on the right. */
      #c .text {
        position: absolute;
        left: var(--safe);
        top: var(--safe);
        bottom: var(--safe);
        width: 440px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      #c .title {
        font-size: 64px;
        line-height: 1.12;
      }
      #c .rule {
        width: 96px;
        height: 3px;
        background: var(--gold);
        margin: 30px 0 28px;
      }
      #c .line {
        font-size: 30px;
      }
      #c .url {
        font-size: 24px;
        margin-top: 34px;
      }
      #c .mosaic {
        position: absolute;
        top: 0;
        right: 0;
        width: 704px;
        height: 640px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 4px;
        background: var(--dark);
      }
      #c .mosaic img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
    </style>
  </head>
  <body>
    <section class="card" id="a">
      <img
        class="shot"
        src="../screenshots/gallery-mandelbrot-seahorse-valley.webp"
        alt="Seahorse Valley in the Mandelbrot set"
      />
      <div class="shade"></div>
      <div class="text">
        <h1 class="title">Fractal Garden</h1>
        <p class="line">Zoom into 62 fractals live in your browser, and learn how each one is drawn.</p>
        <p class="url">fractal.garden</p>
      </div>
    </section>

    <section class="card" id="b">
      <h1 class="title">Fractal Garden</h1>
      <p class="line">62 fractals you can zoom into and change, live in your browser</p>
      <div class="tiles">
        <img src="../../../public/assets/fractal-images/mandelbrot.jpg" alt="Mandelbrot set" />
        <img src="../../../public/assets/fractal-images/julia-set.jpg" alt="Julia set" />
        <img src="../../../public/assets/fractal-images/burning-ship.jpg" alt="Burning Ship" />
        <img src="../../../public/assets/fractal-images/barnsley-fern.jpg" alt="Barnsley fern" />
        <img src="../../../public/assets/fractal-images/menger-sponge.jpg" alt="Menger sponge" />
        <img
          src="../../../public/assets/fractal-images/l-system-dragon-curve.jpg"
          alt="Dragon curve"
        />
      </div>
      <p class="url">fractal.garden</p>
    </section>

    <section class="card" id="c">
      <div class="text">
        <h1 class="title">Fractal<br />Garden</h1>
        <div class="rule"></div>
        <p class="line">62 fractals to zoom into, with an article on each one</p>
        <p class="url">fractal.garden</p>
      </div>
      <div class="mosaic">
        <img src="../screenshots/gallery-mandelbulb.webp" alt="Mandelbulb" />
        <img src="../screenshots/gallery-julia-sea-spiral.webp" alt="Julia set, Sea spiral" />
        <img
          src="../screenshots/gallery-burning-ship-little-ship.webp"
          alt="Burning Ship, Little ship"
        />
        <img src="../screenshots/gallery-barnsley-fern.webp" alt="Barnsley fern" />
      </div>
    </section>

    <script>
      const variant = new URLSearchParams(location.search).get("v") || "a";
      document.getElementById(variant)?.classList.add("active");
    </script>
  </body>
</html>
